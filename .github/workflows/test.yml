name: unit-tests

# 只跑纯逻辑单测 —— 不需要 HarmonyOS SDK，所以能在 GitHub 托管 runner 上跑。
# 编译 HAP 不在这里做（需要 DEVECO_SDK_HOME + 2.7GB 工具链，公开 runner 上不现实）。
#
# 目的：保证「clone 下来测试是绿的」这件事由机器守着，而不是靠谁口头说。

on:
  push:
    # 所有分支都跑，不只是 main —— 否则在功能分支上推了坏代码不会有人拦。
    # （2026-10-20 栽过：配成 [main] 后，自检分支的推送压根没触发 CI，白等一轮。）
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 环境信息
        run: |
          node --version
          echo "仓库文件数: $(git ls-files | wc -l)"

      - name: 单测（全部套件，由 run-tests.sh 统计）
        # 用与本地完全相同的入口，别在 CI 里再抄一份循环 ——
        # 两套实现迟早会不一致（谁是准的说不清），断言条数也会变成两处手抄。
        # 失败时打一条 ::error:: 注解（含失败套件与日志尾部）：job 日志要鉴权才读得到，
        # 注解经 /check-runs/{id}/annotations 公开可读，是本仓库唯一的远程诊断通道。
        run: |
          set +e
          bash tools/run-tests.sh 2>&1 | tee /tmp/unit.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::单测红：$(grep -E '失败套件' /tmp/unit.log | tr '\n' ' ')"
            echo "::error::FAIL 行：$(grep -E '^FAIL|违规|^ *entry/src/main/ets/' /tmp/unit.log | head -30 | tr '\n' '|' | sed 's/%/%25/g')"
            echo "::error::日志尾部：$(tail -25 /tmp/unit.log | tr '\n' '|' | sed 's/%/%25/g')"
            exit "$code"
          fi

      - name: 关键资源必须在仓库里
        # 这两条是 .gitignore 最容易被写错的地方，用 CI 钉死：
        # 1) TLS 中间证书被忽略 → 编译照样过，运行期 loadCaPem 静默降级（TLS 失败）
        # 2) app 图标被全局 *.png 误伤 → 打包缺图
        run: |
          set -e
          test -s entry/src/main/resources/rawfile/seatlib_tls_intermediate.pem \
            || { echo "❌ 缺 TLS 中间证书（运行期会静默降级）"; exit 1; }
          echo "✅ pem 在位"
      - name: 图标三件套必须是真图（两处 × 三个，非 1x1 占位）
        # 2026-10-24 栽过：app.json5 的 app 级 icon 解析 **AppScope** 资源，
        # 只换了 entry 的那套 ⇒ 合并后 HAP 内 background/foreground 仍是 1x1
        # 占位（65 字节），桌面图标渲染成灰块。旧守卫只查 entry 的 startIcon
        # 且只查非空（-s），占位图轻松过关 —— 核验方法不对 = 假否定。
        # 新守卫：AppScope（background/foreground，app 级图标）+
        # entry（background/foreground/startIcon，ability 图标 + 启动窗），
        # 全部要求是合法 PNG 且边长 ≥64（占位图恒 1x1）。
        run: |
          set -e
          python3 - <<'PY'
          import struct, sys
          # 目录 → 该目录下必须存在的图标文件
          plan = {
              'AppScope/resources/base/media': ['background.png', 'foreground.png'],
              'entry/src/main/resources/base/media': ['background.png', 'foreground.png', 'startIcon.png'],
          }
          bad = []
          for d, names in plan.items():
              for n in names:
                  p = f'{d}/{n}'
                  try:
                      with open(p, 'rb') as f:
                          head = f.read(24)
                  except FileNotFoundError:
                      bad.append(f'{p} 缺失')
                      continue
                  if len(head) < 24 or head[:8] != b'\x89PNG\r\n\x1a\n':
                      bad.append(f'{p} 不是 PNG')
                      continue
                  w, h = struct.unpack('>II', head[16:24])
                  if w < 64 or h < 64:
                      bad.append(f'{p} 是 {w}x{h} 占位图')
          if bad:
              print('\n'.join('❌ ' + b for b in bad))
              sys.exit(1)
          print('✅ AppScope/entry 两处图标三件套均为真图')
          PY
